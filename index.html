<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Launch</title>
  
  <link rel="icon" type="image/png" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.0.0/encoding.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="fab-size-medium grid-size-140 layout-single">

  <!-- 🌟 中央のフローティング切り替えボタン (FAB) -->
  <div class="fab-switch" id="modeSwitchBtn" title="モード切り替え">
    <svg class="icon-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <svg class="icon-bookmark" viewBox="0 0 24 24"><path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z"/></svg>
  </div>

  <div class="main-content">
    <div id="view-main" class="view active">
      
      <!-- 🔍 検索バー周辺 -->
      <div class="search-top-bar">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="searchInput" class="search-input" placeholder="" autocomplete="off">
          <div class="search-actions">
            <button class="icon-btn" id="historyBtn" title="検索履歴"><svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg></button>
            <button class="icon-btn" id="clearBtn" title="クリア" style="display: none;"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
          </div>
        </div>
      </div>
      <div id="historyDropdown" class="history-dropdown"></div>

      <header><div class="tabs" id="tabsContainer"></div></header>
      <div class="slider" id="sliderContainer"></div>
    </div>
  </div>

  <!-- 🌟 下部ナビゲーション -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <div class="nav-item" id="nav-edit-toggle" title="編集モード切り替え">
        <svg id="icon-edit-on" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        <svg id="icon-edit-off" viewBox="0 0 24 24" style="display:none;"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        <span class="nav-label" id="label-edit-toggle">編集：オン</span>
      </div>
      <div class="nav-item" id="nav-profiles" title="プロファイル">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span class="nav-label">プロファイル</span>
      </div>
      <div class="nav-item" id="nav-settings" title="設定">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
        <span class="nav-label">設定</span>
      </div>
    </div>
  </nav>

  <!-- 🌟 プロファイルモーダル -->
  <div id="profilesModal" class="glass-modal-overlay">
    <div class="glass-modal" style="max-width: 440px;">
      <div class="glass-modal-header">
        プロファイル
        <button class="glass-modal-close" onclick="closeModalUi('profilesModal')"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      </div>
      <div class="glass-modal-body">
        <div id="profileListContainer" style="margin-bottom: 24px;"></div>
        <div class="edit-only" style="display: flex; gap: 12px; justify-content: center;">
          <button class="modal-btn save" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;" onclick="createNewProfile()">
            <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#fff;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> 新規作成
          </button>
          <button class="modal-btn cancel" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;" id="importProfileBtn">
            <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor;"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg> インポート
          </button>
          <input type="file" id="importFileInput" accept=".json" style="display: none;">
        </div>
      </div>
    </div>
  </div>

  <!-- 🌟 設定モーダル -->
  <div id="settingsModal" class="glass-modal-overlay">
    <div class="glass-modal" style="max-width: 600px;">
      <div class="glass-modal-header">
        設定
        <button class="glass-modal-close" onclick="closeModalUi('settingsModal')"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      </div>
      <div class="glass-modal-body">
        <div class="settings-section">
          <div class="settings-section-title">検索</div>
          <div class="settings-group">
            <div class="settings-row"><span>Enterキーでの検索エンジン</span>
              <select id="settingDefaultSearchEngine" class="custom-select">
                <option value="google">Google</option>
                <option value="yahoo">Yahoo! JAPAN</option>
                <option value="bing">Bing</option>
                <option value="duckduckgo">DuckDuckGo</option>
              </select>
            </div>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-title">デザイン</div>
          <div class="settings-group">
            <div class="settings-row"><span>レイアウト</span><select id="settingLayoutMode" class="custom-select"><option value="single">1カラム (標準)</option><option value="split">2カラム (左右分割)</option></select></div>
            <div class="settings-row"><span>切替ボタンの大きさ</span><select id="settingFabSize" class="custom-select"><option value="small">小さい</option><option value="medium">普通</option><option value="large">大きい</option></select></div>
            <div class="settings-row"><span>アイコンの大きさ</span><select id="settingGridSize" class="custom-select"><option value="120">小さい (120px)</option><option value="140">普通 (140px)</option><option value="160">大きい (160px)</option></select></div>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">リンクの開き方</div>
          <div class="settings-group">
            <div class="settings-row"><span>開き方を指定</span>
              <select id="settingLinkOpenMode" class="custom-select">
                <option value="self">現在のタブ</option>
                <option value="blank">新しいタブ</option>
              </select>
            </div>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">データ管理</div>
          <div class="settings-group">
            <div class="settings-row actionable blue" id="exportAllProfilesBtn"><span>全てのプロファイルをエクスポート</span></div>
            <div class="settings-row actionable danger edit-only" id="initDataBtn"><span>すべてのデータを初期化</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- アイテム/フォルダ/プロファイル 編集用モーダル -->
  <div id="customModal" class="glass-modal-overlay edit-modal-overlay">
    <div class="modal-box">
      <h3 id="modalTitle">Edit</h3>
      <div class="modal-inputs">
        <input type="text" id="modalInput1" autocomplete="off" placeholder="名前">
        <input type="text" id="modalInput2" autocomplete="off" placeholder="ブックマークURL (例: https://google.com)">
        <input type="text" id="modalInput3" autocomplete="off" placeholder="検索用URL (任意, クエリを末尾に)">
        <select id="modalInputEncoding">
          <option value="UTF-8">文字コード: UTF-8</option>
          <option value="SJIS">文字コード: Shift_JIS</option>
          <option value="EUCJP">文字コード: EUC-JP</option>
        </select>
        <input type="text" id="modalInput4" autocomplete="off" placeholder="カスタムアイコンURL (任意)">
      </div>
      <div class="modal-actions">
        <button id="modalPresetBtn" class="modal-btn" style="background: var(--app-green); color: white; display: none; padding: 12px 14px; font-size: 14px;">
          <svg style="width:18px;height:18px;fill:currentColor;vertical-align:middle;margin-right:6px;" viewBox="0 0 24 24"><path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z"/></svg>リストから選ぶ
        </button>
        <div style="display: flex; gap: 8px; margin-left: auto;">
          <button id="modalCancelBtn" class="modal-btn cancel">キャンセル</button>
          <button id="modalSaveBtn" class="modal-btn save">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 🌟 JSONリスト選択用モーダル -->
  <div id="jsonSelectModal" class="glass-modal-overlay">
    <div class="glass-modal" style="max-width: 860px; max-height: 85vh; width: 95%;">
      <div class="glass-modal-header">
        リストからアイテムを選ぶ
        <button class="glass-modal-close" onclick="closeModalUi('jsonSelectModal')"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      </div>
      <div class="glass-modal-body" id="jsonSelectBody" style="padding: 24px; padding-bottom: 40px;">
        <div style="text-align: center; color: var(--text-sub); margin-top: 20px;">読み込み中...</div>
      </div>
      <div style="padding: 16px 24px; border-top: 1px solid var(--nav-border); background: var(--card-bg); display: flex; justify-content: flex-end; gap: 12px; flex-shrink: 0;">
        <button class="modal-btn cancel" onclick="closeModalUi('jsonSelectModal')">キャンセル</button>
        <button id="jsonSelectAddBtn" class="modal-btn save" disabled>アイテムを追加</button>
      </div>
    </div>
  </div>

  <!-- カスタム確認モーダル -->
  <div id="confirmModal" class="glass-modal-overlay confirm-modal-overlay">
    <div class="confirm-box">
      <h3 id="confirmTitle">確認</h3>
      <p id="confirmMessage"></p>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button id="confirmCancelBtn" class="modal-btn cancel" style="flex: 1;">キャンセル</button>
        <button id="confirmOkBtn" class="modal-btn save" style="flex: 1;">OK</button>
      </div>
    </div>
  </div>

  <!-- 🌟 コンテキストメニュー（コピー＆ペースト対応） -->
  <div id="contextMenu" class="context-menu">
    <!-- アイテム専用 -->
    <div class="menu-item menu-type-item" id="menuOpen"><svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>新しいタブで開く</div>
    <div class="menu-item menu-type-item" id="menuCopy"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>URLをコピー</div>
    <div class="menu-divider menu-type-item" id="menuDividerItem"></div>

    <!-- 編集・名前変更 -->
    <div class="menu-item menu-type-edit" id="menuEdit"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>編集</div>
    <div class="menu-item menu-type-folder" id="menuRenameFolder"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>名前変更</div>

    <!-- コピー系 -->
    <div class="menu-item menu-type-item" id="menuCopyItem"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>アイテムをコピー</div>
    <div class="menu-item menu-type-heading" id="menuCopyHeading"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>グループをコピー</div>
    <div class="menu-item menu-type-folder" id="menuCopyFolder"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>フォルダをコピー</div>

    <!-- ペースト系 -->
    <div class="menu-item" id="menuPasteItem"><svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>アイテムを貼り付け</div>
    <div class="menu-item" id="menuPasteHeading"><svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>グループを貼り付け</div>
    <div class="menu-item" id="menuPasteFolder"><svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>フォルダを貼り付け</div>

    <div class="menu-divider" id="menuDividerDelete"></div>

    <!-- 削除系 -->
    <div class="menu-item menu-type-edit" id="menuRemove"><svg viewBox="0 0 24 24"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>削除</div>
    <div class="menu-item menu-type-heading" id="menuRemoveHeading"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zm2.46-7.12l1.41-1.41L12 12.59l2.12-2.12 1.41 1.41L13.41 14l2.12 2.12-1.41 1.41L12 15.41l-2.12 2.12-1.41-1.41L10.59 14l-2.12-2.12zM15.5 4l-1-1h-5l-1 1H5v2h14V4z"/></svg>小見出しを削除</div>
    <div class="menu-item menu-type-folder" id="menuRemoveFolder"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zm2.46-7.12l1.41-1.41L12 12.59l2.12-2.12 1.41 1.41L13.41 14l2.12 2.12-1.41 1.41L12 15.41l-2.12 2.12-1.41-1.41L10.59 14l-2.12-2.12zM15.5 4l-1-1h-5l-1 1H5v2h14V4z"/></svg>削除</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
